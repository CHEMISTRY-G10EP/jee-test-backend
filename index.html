<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practice Test</title>
<style>
  body {
    font-family: sans-serif;
    margin: 15px;
    background: linear-gradient(135deg, #f9f9f9, #e0f7fa);
    color: #333;
    font-size: 13px;
  }
  .header-bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .header-bar h1 { color:#006064; font-size:16px; margin:0; white-space:nowrap; flex:1; overflow:hidden; text-overflow:ellipsis; }
  label { font-weight:bold; color:#00796B; margin-right:4px; font-size:12px; }
  select, button { margin:4px; padding:5px 8px; border:2px solid #00796B; border-radius:5px; background:#e0f2f1; color:#004D40; font-size:12px; cursor:pointer; }
  select:hover, button:hover { background:#b2dfdb; }
  button.back-btn { background:#b71c1c; color:white; padding:5px 10px; }
  iframe { width:100%; height:450px; border:2px solid #004D40; margin-top:15px; border-radius:6px; box-shadow:0 3px 6px rgba(0,0,0,0.1); transition:height 0.4s ease; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="header-bar">
  <h1>Practice Test</h1>
  <button class="back-btn" onclick="resetAll()">Back</button>
</div>

<div id="controls">
  <label for="classSelect">Class:</label>
  <select id="classSelect">
    <option value="">Select Class</option>
    <option value="Class 8">Class 8</option>
    <option value="Class 9">Class 9</option>
    <option value="Class 10">Class 10</option>
    <option value="Class 11">Class 11</option>
    <option value="Class 12">Class 12</option>
    <option value="IIT-JEE">IIT-JEE</option>
    <option value="NEET">NEET</option>
    <option value="CUET">CUET</option>
  </select>

  <label for="subjectSelect">Subject:</label>
  <select id="subjectSelect" disabled>
    <option value="">Select Subject</option>
  </select>

  <label for="levelSelect">Level / Years:</label>
  <select id="levelSelect" disabled>
    <option value="">Select Level / Years</option>
  </select>

  <label for="chapterSelect">Chapter:</label>
  <select id="chapterSelect" disabled>
    <option value="">Select Chapter</option>
  </select>

  <label for="itemSelect">Topic / Year:</label>
  <select id="itemSelect" disabled>
    <option value="">Select Topic / Year</option>
  </select>
</div>

<iframe id="viewer" src=""></iframe>

<script>
  // === Catalog Data ===
  const catalog = {
    "Class 10": {
      "Science": {
        "Topic wise mcq (basic)": {
          "Chapter 1 - Chemical Reaction And Equation": {
            "1. Names of Chemical Compounds": "https://class-103.github.io/Class-10-Science-10-E--Che-Rec---Equation/1. Names of Chemical Compounds.html"
          }
        }
      }
    }
  };

  const classSelect = document.getElementById('classSelect');
  const subjectSelect = document.getElementById('subjectSelect');
  const levelSelect = document.getElementById('levelSelect');
  const chapterSelect = document.getElementById('chapterSelect');
  const itemSelect = document.getElementById('itemSelect');
  const viewer = document.getElementById('viewer');

  function populateSelect(selectEl, options) {
    selectEl.innerHTML = '<option value="">Select</option>';
    Object.keys(options).forEach(opt => {
      const option = document.createElement('option');
      option.value = opt;
      option.textContent = opt;
      selectEl.appendChild(option);
    });
    selectEl.disabled = false;
  }

  classSelect.addEventListener('change', () => {
    const cls = classSelect.value;
    if (cls && catalog[cls]) populateSelect(subjectSelect, catalog[cls]);
    else subjectSelect.disabled = true;
    levelSelect.disabled = true;
    chapterSelect.disabled = true;
    itemSelect.disabled = true;
    viewer.src = '';
  });

  subjectSelect.addEventListener('change', () => {
    const cls = classSelect.value;
    const sub = subjectSelect.value;
    if (cls && sub && catalog[cls][sub]) populateSelect(levelSelect, catalog[cls][sub]);
    else levelSelect.disabled = true;
    chapterSelect.disabled = true;
    itemSelect.disabled = true;
    viewer.src = '';
  });

  levelSelect.addEventListener('change', () => {
    const cls = classSelect.value;
    const sub = subjectSelect.value;
    const lvl = levelSelect.value;
    if (cls && sub && lvl && catalog[cls][sub][lvl]) populateSelect(chapterSelect, catalog[cls][sub][lvl]);
    else chapterSelect.disabled = true;
    itemSelect.disabled = true;
    viewer.src = '';
  });

  chapterSelect.addEventListener('change', () => {
    const cls = classSelect.value;
    const sub = subjectSelect.value;
    const lvl = levelSelect.value;
    const chap = chapterSelect.value;
    if (cls && sub && lvl && chap && catalog[cls][sub][lvl][chap]) populateSelect(itemSelect, catalog[cls][sub][lvl][chap]);
    else itemSelect.disabled = true;
    viewer.src = '';
  });

  itemSelect.addEventListener('change', () => {
    const cls = classSelect.value;
    const sub = subjectSelect.value;
    const lvl = levelSelect.value;
    const chap = chapterSelect.value;
    const item = itemSelect.value;
    if (cls && sub && lvl && chap && item) {
      viewer.src = catalog[cls][sub][lvl][chap][item];
    }
  });

  function resetAll() {
    classSelect.value = '';
    subjectSelect.disabled = true;
    levelSelect.disabled = true;
    chapterSelect.disabled = true;
    itemSelect.disabled = true;
    viewer.src = '';
  }

  // === Payment + Access Control ===
  async function checkAccessAndMaybeLoad() {
    try {
      const r = await fetch('https://jee-test-backend.onrender.com/access', { credentials: 'include' });
      if (r.status === 401) {
        alert("Not logged in. Please login first.");
        window.location.href = "/login.html";
        return;
      }
      const j = await r.json();
      if (j.allowed) {
        console.log('✅ Access allowed');
        return; // normal UI works
      } else {
        if (confirm('Payment required to access tests. Pay now?')) {
          const create = await fetch('https://jee-test-backend.onrender.com/create-order', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: 49 })
          });
          const d = await create.json();
          if (d.ok && d.txnToken) {
            const config = {
              "root": "",
              "style": {},
              "data": {
                "orderId": d.orderId,
                "token": d.txnToken,
                "tokenType": "TXN_TOKEN",
                "amount": String(d.amount)
              },
              "flow": "DEFAULT"
            };
            const script = document.createElement('script');
script.src = "https://securegw-stage.paytm.in/merchantpgpui/checkoutjs/merchants/xeQOhi06609068167619.js";

            script.onload = () => {
              if (window.Paytm && window.Paytm.CheckoutJS) {
                window.Paytm.CheckoutJS.init(config).then(() => {
                  window.Paytm.CheckoutJS.invoke();
                }).catch(err => { console.error(err); alert('Checkout init failed'); });
              } else {
                alert('Paytm Checkout not loaded');
              }
            };
            document.head.appendChild(script);
          } else {
            alert('Could not create order: ' + (d.message || 'unknown'));
          }
        }
      }
    } catch (err) {
      console.error(err);
      alert('Error connecting to backend');
    }
  }

  window.onload = checkAccessAndMaybeLoad;
</script>
</body>
</html>
